version: '3.9'

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  shortener-net:
    driver: bridge

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres-data:
  redis-data:
  kafka-data:
  prometheus-data:
  grafana-data:

# ─── Common environment ────────────────────────────────────────────────────────
