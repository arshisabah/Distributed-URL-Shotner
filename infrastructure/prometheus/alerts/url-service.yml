groups:
  - name: url_service
    rules:
      - alert: HighRedirectLatency
        expr:  histogram_quantile(0.99, rate(url_redirect_duration_bucket[5m])) > 0.05
        for:   2m
        labels: { severity: warning }
        annotations:
          summary: "p99 redirect latency > 50 ms"

      - alert: HighErrorRate
        expr:  |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          / sum(rate(http_server_requests_seconds_count[5m])) > 0.01
        for:   2m
        labels: { severity: critical }
        annotations:
          summary: "Error rate > 1%"

      - alert: CacheMissRateHigh
        expr:  |
          rate(cache_l1_miss_total[5m])
          / (rate(cache_l1_hit_total[5m]) + rate(cache_l1_miss_total[5m])) > 0.3
        for:   5m
        labels: { severity: warning }
        annotations:
          summary: "Cache miss rate > 30% — check Redis"
