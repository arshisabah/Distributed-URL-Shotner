# Development profile — overrides for local Docker Compose
spring:
  datasource:
    url:      jdbc:postgresql://localhost:5432/urlshortener
    username: shortener
    password: devpassword
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
  jpa:
    properties:
      hibernate:
        format_sql: true
  flyway:
    baseline-on-migrate: true

app:
  base-url:    http://localhost:8080
  worker-id:   1
  instance-id: dev-1

