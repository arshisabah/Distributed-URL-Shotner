# url-service/src/main/resources/application.yml
# ─────────────────────────────────────────────────────────────────────────────
# URL Service — Main Configuration
# Override with environment variables or profile-specific files:
#   application-development.yml  (local Docker Compose)
#   application-production.yml   (K8s / AWS)
# ─────────────────────────────────────────────────────────────────────────────

spring:
  application:
    name: url-service

  # ─── Database ──────────────────────────────────────────────────────────────
  datasource:
    url:      ${DB_URL:jdbc:postgresql://localhost:5432/urlshortener}
    username: ${DB_USERNAME:shortener}
    password: ${DB_PASSWORD:devpassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name:          url-service-pool
      maximum-pool-size:  ${DB_POOL_MAX:20}
      minimum-idle:       ${DB_POOL_MIN:5}
      connection-timeout: 3000      # 3 s — fail fast, don't queue indefinitely
      idle-timeout:       600000    # 10 min
      max-lifetime:       1800000   # 30 min
      validation-timeout: 1000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: validate            # NEVER create/drop in production; Flyway owns schema
    open-in-view: false             # Avoid lazy-load surprises; fetch what you need
    properties:
      hibernate:
        dialect:             org.hibernate.dialect.PostgreSQLDialect
        format_sql:          false
        jdbc.batch_size:     50
        order_inserts:       true
        order_updates:       true
        generate_statistics: false

  # ─── Flyway ────────────────────────────────────────────────────────────────
  flyway:
    enabled:   true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # ─── Redis ─────────────────────────────────────────────────────────────────
  data:
    redis:
      host:     ${REDIS_HOST:localhost}
      port:     ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout:  500ms                 # Command timeout — fail fast, fall to DB
      lettuce:
        pool:
          max-active:  20
          max-idle:    10
          min-idle:    2
          max-wait:    200ms
        shutdown-timeout: 200ms

  # ─── Kafka ─────────────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks:    1
      retries: 3
      properties:
        linger.ms:         5
        batch.size:        65536
        compression.type:  lz4

  # ─── Caching ───────────────────────────────────────────────────────────────
  cache:
    type: redis

  # ─── Virtual threads (Java 21) ─────────────────────────────────────────────
  threads:
    virtual:
      enabled: true     # Tomcat uses virtual threads → 100k+ concurrency

# ─── Server ────────────────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled:           true
    min-response-size: 1024
    mime-types:        application/json,text/html,text/plain
  tomcat:
    max-connections:     10000
    accept-count:        200
    connection-timeout:  5000
    keep-alive-timeout:  30000

# ─── Application ───────────────────────────────────────────────────────────────
app:
  base-url:        ${APP_BASE_URL:https://sho.rt}
  worker-id:       ${WORKER_ID:1}
  instance-id:     ${POD_NAME:local-1}
  blocked-domains: ${BLOCKED_DOMAINS:}     # comma-separated

  expiry-scheduler:
    fixed-delay-ms:  300000   # 5 min
    initial-delay-ms: 30000   # 30 s initial delay (let app fully start first)

  cache-warming:
    cron: "0 0 3 * * *"       # 3 AM daily

# ─── JWT ───────────────────────────────────────────────────────────────────────
jwt:
  # RS256 public key (PEM format) — set via environment variable
  # auth-service holds the private key; url-service only needs public key for verification
  public-key: ${JWT_PUBLIC_KEY:}

# ─── Resilience4j ──────────────────────────────────────────────────────────────
resilience4j:
  circuit-breaker:
    instances:
      redis:
        failure-rate-threshold:          50
        slow-call-rate-threshold:        80
        slow-call-duration-threshold:    200ms
        wait-duration-in-open-state:     10s
        sliding-window-size:             20
        minimum-number-of-calls:         5
        permitted-calls-in-half-open:    3
      database:
        failure-rate-threshold:          60
        wait-duration-in-open-state:     60s
        sliding-window-size:             30
        minimum-number-of-calls:         10
  retry:
    instances:
      database:
        max-attempts:  3
        wait-duration: 100ms

# ─── Actuator / Metrics ────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,flyway
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true   # K8s liveness/readiness
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      service: url-service
      region:  ${AWS_REGION:local}
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:0.1}

# ─── OpenAPI ───────────────────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha

# ─── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    root:                     INFO
    com.shortener:            DEBUG
    org.springframework.web:  INFO
    org.hibernate.SQL:        ${LOG_SQL:WARN}
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] [%X{requestId}] %-5level %logger{36} - %msg%n"
